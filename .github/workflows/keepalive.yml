# Keeps the free Render instance awake (it sleeps after 15 min without inbound traffic).
# Set the repo variable STAGE_URL (e.g. https://afterglow-xxxx.onrender.com) to enable;
# with it unset, the job is skipped. Pinging 24/7 uses ~720 of Render's 750 free hours/month.
name: keep-alive
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    if: ${{ vars.STAGE_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Ping health endpoint
        env:
          STAGE_URL: ${{ vars.STAGE_URL }}
        run: curl -fsS --max-time 100 --retry 2 --retry-delay 10 "$STAGE_URL/api/health" -o /dev/null -w "%{http_code} in %{time_total}s\n"
