services:
  - type: web
    name: afterglow
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: MODEL_API_KEY
        sync: false          # set in the Render dashboard; never committed
      - key: MOCK
        value: "0"
      - key: DAILY_BUDGET_USD
        value: "5"
      - key: PERFORM_SECONDS_PER_IP
        value: "180"
